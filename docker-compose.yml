version: '3.8'

services:
  prometheus-nexus:
    build: .
    container_name: prometheus-nexus
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - .:/app
    restart: unless-stopped
